# Pantalla de bloqueo — Glass neutro

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/miau2.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.5
}

# Hora
label {
    monitor =
    text = $TIME
    color = rgba(f2f2f2ff)
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(ffffffb3)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# Contraseña
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 1
    rounding = 12
    outer_color = rgba(ffffff40)
    inner_color = rgba(ffffff14)
    font_color = rgba(f2f2f2ff)
    check_color = rgba(e6e6e6ff)
    fail_color = rgba(ff8a8aff)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff80">contraseña</span>
    fail_text = incorrecta
    dots_center = true
    position = 0, -40
    halign = center
    valign = center
}
